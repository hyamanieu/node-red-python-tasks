<script type="text/javascript">
RED.nodes.registerType('python-env',{
    category: 'config',
    color: '#306998',
    defaults: {
        name: {value: ''},
        projectDir: {value: '', required: true},
        environment: {value: 'default'},
        startupTimeout: {value: 120000}
    },
    inputs: 0,
    outputs: 0,
    icon: "python.png",
    label: function() {
        return this.name || "Python Environment";
    },
    oneditprepare: function() {
        // Configure timeout as number
        $('#node-input-startupTimeout').typedInput({
            type: 'num',
            types: ['num']
        });
    }
});
</script>

<div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name">
</div>
<div class="form-row">
    <label for="node-input-projectDir"><i class="fa fa-folder"></i> Project Directory</label>
    <input type="text" id="node-input-projectDir" placeholder="/path/to/pixi/project">
    <div class="form-tip">Directory containing a pixi.toml file that defines the Python environment</div>
</div>
<div class="form-row">
    <label for="node-input-environment"><i class="fa fa-cog"></i> Environment</label>
    <input type="text" id="node-input-environment" placeholder="default">
    <div class="form-tip">Name of the pixi environment to use (default: default)</div>
</div>
<div class="form-row">
    <label for="node-input-startupTimeout"><i class="fa fa-clock-o"></i> Startup Timeout (ms)</label>
    <input type="text" id="node-input-startupTimeout" placeholder="120000">
    <div class="form-tip">Time to wait for the Python environment to start (default: 120000ms)</div>
</div>

<script type="text/html" data-help-name="python-env">
    <p>Configuration node for a Python environment managed by pixi.</p>
    <p>Specify the directory containing a <code>pixi.toml</code> file and the environment name to use.</p>
    <p>The environment will be installed and a worker process will be started to execute Python functions.</p>
    <p><b>Note:</b> This is a configuration node. It will not appear as a node in your flows but can be referenced by python-function and python-run nodes.</p>
</script>
