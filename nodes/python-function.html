<script type="text/javascript">
(function() {
    'use strict';
    RED.nodes.registerType('python-function',{
        category: 'python',
        color: '#306998',
        defaults: {
            name: {value: ''},
            workspace: {type: 'python-workspace', required: true},
            functionBody: {value: ''},
            imports: {value: ''},
            timeout: {value: 30000}
        },
        inputs: 1,
        outputs: 1,
        icon: "font-awesome/fa-code",
        label: function() {
            return this.name || "Python Function";
        },
        oneditprepare: function() {
            // Configure timeout as number
            $('#node-input-timeout').typedInput({
                type: 'num',
                types: ['num']
            });
        }
    });
}());
</script>

<script type="text/html" data-template-name="python-function">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-workspace"><i class="fa fa-cog"></i> Python Workspace</label>
        <input type="text" id="node-input-workspace">
        <div class="form-tip">Select a configured Python workspace</div>
    </div>
    <div class="form-row">
        <label for="node-input-functionBody"><i class="fa fa-code"></i> Function Body</label>
        <textarea id="node-input-functionBody" placeholder="return payload * 2" rows="10"></textarea>
        <div class="form-tip">Python code that processes the msg.payload. Use 'payload' as the input variable. Do not include 'def' or 'return' statements.</div>
    </div>
    <div class="form-row">
        <label for="node-input-imports"><i class="fa fa-book"></i> Pre-imported Modules</label>
        <input type="text" id="node-input-imports" placeholder="numpy, pandas">
        <div class="form-tip">Comma-separated list of modules to import before executing the function (e.g., numpy,pandas)</div>
    </div>
    <div class="form-row">
        <label for="node-input-timeout"><i class="fa fa-clock-o"></i> Timeout (ms)</label>
        <input type="text" id="node-input-timeout" placeholder="30000">
        <div class="form-tip">Per-call timeout in milliseconds. Set to 0 to disable timeout.</div>
    </div>
</script>

<script type="text/html" data-help-name="python-function">
    <p>Executes a Python function for each input message using the workspace's persistent worker process.</p>
    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">any</span></dt>
        <dd>Passed to the function as the <code>payload</code> variable.</dd>
    </dl>
    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">any</span></dt>
        <dd>The function's return value. All other <code>msg</code> properties are preserved.</dd>
    </dl>
    <h3>Details</h3>
    <p><b>Function Body:</b> Python code that uses <code>payload</code> as the input and returns the result, e.g. <code>return payload * 2</code>.</p>
    <p><b>Pre-imported Modules:</b> Comma-separated modules imported before each call (e.g. <code>numpy,pandas</code>), available in the body without import statements.</p>
    <p><b>Error Handling:</b> Python exceptions are reported via <code>node.error</code> with type, message and traceback, so <b>catch</b> nodes handle them.</p>
</script>
