<script type="text/javascript">
(function() {
    'use strict';
    RED.nodes.registerType('python-run',{
        category: 'python',
        color: '#306998',
        defaults: {
            name: {value: ''},
            workspace: {type: 'python-workspace', required: true},
            command: {value: '', required: true},
            args: {value: ''},
            timeout: {value: 30000}
        },
        inputs: 1,
        outputs: 1,
        icon: "font-awesome/fa-terminal",
        label: function() {
            return this.name || "Python Run";
        },
        oneditprepare: function() {
            // Configure timeout as number
            $('#node-input-timeout').typedInput({
                type: 'num',
                types: ['num']
            });
        }
    });
}());
</script>

<script type="text/html" data-template-name="python-run">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-workspace"><i class="fa fa-cog"></i> Python Workspace</label>
        <input type="text" id="node-input-workspace">
        <div class="form-tip">Select a configured Python workspace</div>
    </div>
    <div class="form-row">
        <label for="node-input-command"><i class="fa fa-terminal"></i> Command</label>
        <input type="text" id="node-input-command" placeholder="python-script">
        <div class="form-tip">Command to execute inside the Python workspace</div>
    </div>
    <div class="form-row">
        <label for="node-input-args"><i class="fa fa-list"></i> Fixed Arguments</label>
        <input type="text" id="node-input-args" placeholder="arg1, arg2">
        <div class="form-tip">Comma-separated list of arguments to pass before the payload arguments</div>
    </div>
    <div class="form-row">
        <label for="node-input-timeout"><i class="fa fa-clock-o"></i> Timeout (ms)</label>
        <input type="text" id="node-input-timeout" placeholder="30000">
        <div class="form-tip">Per-call timeout in milliseconds. Set to 0 to disable timeout.</div>
    </div>
</script>

<script type="text/html" data-help-name="python-run">
    <p>Executes a command inside the selected Python environment for each input message.</p>
    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">any</span></dt>
        <dd>Becomes command arguments: an <b>array</b> is passed element-wise (stringified), an <b>object</b> as a single JSON string, anything else as one stringified argument. Fixed arguments are prepended.</dd>
    </dl>
    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">string</span></dt>
        <dd>The command's stdout (trimmed). All other <code>msg</code> properties are preserved.</dd>
    </dl>
    <h3>Details</h3>
    <p><b>Command:</b> Resolved via the PATH of the workspace's Python environment. <b>Timeout:</b> per-call, in ms; 0 disables. Non-zero exit codes and timeouts are reported via <code>node.error</code>, so <b>catch</b> nodes handle them.</p>
</script>
