<script type="text/javascript">
RED.nodes.registerType('python-workspace',{
    category: 'config',
    color: '#306998',
    defaults: {
        name: {value: ''},
        dependencies: {value: ''},
        environment: {value: 'default'},
        startupTimeout: {value: 120000}
    },
    inputs: 0,
    outputs: 0,
    icon: "font-awesome/fa-cog",
    label: function() {
        return this.name || "Python Workspace";
    },
    oneditprepare: function() {
        // Configure dependencies as a list of package specs
        $('#node-input-dependencies').typedInput({
            type: 'str',
            types: ['str']
        });

        // Configure timeout as number
        $('#node-input-startupTimeout').typedInput({
            type: 'num',
            types: ['num']
        });
    }
});
</script>

<script type="text/html" data-template-name="python-workspace">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-dependencies"><i class="fa fa-list"></i> Dependencies</label>
        <textarea type="text" id="node-input-dependencies" placeholder="python=3.9&#10;numpy&#10;pandas=2.0" rows="5"></textarea>
        <div class="form-tip">Package specifications with optional versions, one per line (e.g., python=3.9, numpy, pandas=2.0)</div>
    </div>
    <div class="form-row">
        <label for="node-input-environment"><i class="fa fa-cog"></i> Environment</label>
        <input type="text" id="node-input-environment" placeholder="default">
        <div class="form-tip">Name of the environment to use inside this workspace (default: default)</div>
    </div>
    <div class="form-row">
        <label for="node-input-startupTimeout"><i class="fa fa-clock-o"></i> Startup Timeout (ms)</label>
        <input type="text" id="node-input-startupTimeout" placeholder="120000">
        <div class="form-tip">Time to wait for the Python environment to start (default: 120000ms)</div>
    </div>
</script>

<script type="text/html" data-help-name="python-workspace">
    <p>Configuration node for a Python workspace.</p>
    <p>Specify the package dependencies (with optional versions) needed for your Python code. Each workspace is a reproducible Python environment that runs the same on any machine.</p>
    <p>The node will internally set up a Python environment with these dependencies and start a worker process to execute Python functions.</p>
    <p><b>Note:</b> This is a configuration node. It will not appear as a node in your flows but can be referenced by python-function and python-run nodes.</p>
    <p><b>Dependency format:</b> One package per line, optionally with version specifiers. Examples: <code>python=3.9</code>, <code>numpy</code>, <code>pandas&gt;=2.0</code></p>
</script>
